name: Deploy sushi game to GitHub Pages

# The sushi game lives on its own branch and is published to /sushi/ on gh-pages,
# next to the noodle game that `main` publishes at the root.
on:
  push:
    branches: [sushi]
  pull_request:
    branches: [sushi]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-sushi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4
        if: github.event_name != 'pull_request'
        with:
          branch: gh-pages
          folder: dist
          target-folder: sushi
          clean: true
